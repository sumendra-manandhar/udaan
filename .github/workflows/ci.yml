name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  database:
    # Applies the migration to a real PostGIS database with Supabase's auth and
    # storage schemas stubbed, so a broken migration fails the build.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/stub_supabase.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031000000_init.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031000100_hardening.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261031000200_signup_profiles.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rules_test.sql
