server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # The service worker and manifest must never be cached, or updates stall.
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; default_type application/manifest+json; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  # Digital Asset Links for the Play Store (Trusted Web Activity).
  location = /.well-known/assetlinks.json { default_type application/json; try_files $uri =404; }

  # MapLibre's worker is an ES module file.
  location ~ \.mjs$ { default_type application/javascript; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # Hashed build assets can be cached forever.
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # Single-page app routes.
  location / { try_files $uri /index.html; }
}
